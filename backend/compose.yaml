name: auriqis
services:
  backend:
    image: auriqis-backend:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${BACKEND_ENV_FILE:-./.env.production}
        required: true
    # A host reverse proxy will expose HTTPS/WSS in the hosting step.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
