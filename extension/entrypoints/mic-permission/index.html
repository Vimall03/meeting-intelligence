<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Microphone permission · Meeting Intelligence</title>

  <body>
    <main class="card" aria-live="polite">
      <button class="close" type="button" aria-label="Close permission request" title="Close">×</button>
      <div class="brand-mark" aria-hidden="true">M</div>
      <h1>Enable your microphone</h1>
      <p id="status">Waiting for Brave’s microphone permission prompt…</p>
      <p id="help" class="help">Choose Allow in Brave’s browser prompt. This brief request only checks microphone access; capture starts only when you press Start capture in the side panel.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
